<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Navbar</title>
    <link rel="stylesheet" href="Portfolio.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a id="logo" href="">VJ</a>

            <div class="auth-button">
                <button class="btn btn-outline">Log in</button>
                <button class="btn btn-filled">Sign Up</button>
            </div>
        </nav>
    </header>
    <main class="hero-section">
        <div class="hero">
            <!-- Left Side: Photo -->
            <div class="hero-left">
                <img src="vishal.png" alt="Profile Photo">
            </div>

            <!-- Right Side: Info -->
            <div class="hero-right">
                <h1>Hi, I'm Vishal</h1>
                <h3>Web Developer & Student</h3>
                <p>Welcome to my portfolio! I love coding, solving problems, and building websites.</p>
                <button>Contact Me</button>
            </div>
        </div>
    </main>
</body>

</html>
