<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inline vs Block elements </title>
</head>
<body>
    <!-- Block Elements -->
    <h1> Vishaal </h1>
    <h1> Jadhav</h1>
    <p>
        vishal <br>
        jadhav
    </p>
    <div> Div elements </div>


    <!-- Inline Elements -->
    <a href="google.com"> Click </a>
    <a href="google.com"> DOnt click  </a>
    <img src="Shiv.jpeg" alt="image" height="100px">
    <p> this is <b>Bold</b> and <i> Italic </i> or <u> underline</u> tags </p>
</body>
</html>
