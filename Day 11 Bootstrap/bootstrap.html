<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1>Byte Curious</h1>
        <button type="button" class="btn-solid theme-primary position-relative">
            Profile
            <span
                class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-bg rounded-circle">
                <span class="visually-hidden">New alerts</span>
            </span>
        </button>
        <button type="button" class="btn-solid theme-primary position-relative">
            Inbox
            <span
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill border border-bg theme-danger">
                99+
                <span class="visually-hidden">unread messages</span>
            </span>
        </button>
        <button type="button" class="btn-solid theme-primary">
            Notifications <span class="badge theme-danger">4</span>
        </button>
        <br>
        <br>
        <div class="alert theme-danger" role="alert">
            <p>A simple danger alert—check it out!</p>
        </div>
        <br>
        <div class="alert theme-warning" role="alert">
  <p>Something’s wrong, check the fields below and try again.</p>
  <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
</body>

</html>
